{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | {{ company_name|default:"SORA ERP" }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f10 0%, #1a1a2e 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; color: #e2e8f0;
        }
        .error-card {
            background: #16161a; border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px; padding: 48px 40px; max-width: 460px; width: 100%;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .error-code {
            font-size: 72px; font-weight: 800; line-height: 1; color: #FFD700;
            letter-spacing: 2px; margin-bottom: 16px;
        }
        h1 { font-size: 22px; margin-bottom: 10px; color: #fff; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 11px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: #FFD700; color: #111; }
        .btn-primary:hover { background: #e6c200; }
        .btn-ghost { color: #cbd5e1; border: 1px solid #333; }
        .btn-ghost:hover { border-color: #FFD700; color: #FFD700; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist, was moved, or is temporarily unavailable.</p>
        <div class="actions">
            <a href="/dashboard" class="btn btn-primary"><i class="fas fa-tachometer-alt"></i> Go to Dashboard</a>
            <a href="/" class="btn btn-ghost"><i class="fas fa-home"></i> Home</a>
        </div>
    </div>
</body>
</html>
